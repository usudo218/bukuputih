<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>PDF Flipbook Interaktif</title>

  <!-- Pustaka PDF.js (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Pustaka Page-Flip (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: sans-serif;
    }

    /* Indikator Memuat */
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #f8fafc;
      font-size: 15px;
      text-align: center;
      z-index: 100;
      pointer-events: none;
    }

    /* Pembungkus Layar Penuh */
    .viewer-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: pan-y pinch-zoom;
    }

    .flipbook-container {
      display: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .page {
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .page canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
    }

    /* Area Klik Sentuh Sisi Kiri & Kanan Layar */
    .touch-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 18%;
      z-index: 40;
      cursor: pointer;
    }

    .touch-left {
      left: 0;
    }

    .touch-right {
      right: 0;
    }

    /* Indikator Halaman Minimalis di Pojok Bawah */
    .page-badge {
      position: absolute;
      bottom: 12px;
      background: rgba(15, 23, 42, 0.75);
      color: #f8fafc;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      z-index: 50;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

  <div id="loading">Memuat lembaran buku...</div>

  <div class="viewer-container" id="viewer">
    <!-- Area Sentuh Kiri (Sebelumnya) -->
    <div class="touch-zone touch-left" id="tap-prev" title="Halaman Sebelumnya"></div>

    <!-- Kontainer Buku -->
    <div id="flipbook" class="flipbook-container"></div>

    <!-- Area Sentuh Kanan (Selanjutnya) -->
    <div class="touch-zone touch-right" id="tap-next" title="Halaman Selanjutnya"></div>

    <!-- Info Halaman Ringkas -->
    <div class="page-badge" id="page-badge">1 / -</div>
  </div>

  <script>
    const pdfUrl = 'buku.pdf';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pageFlip = null;

    async function initPdfFlipbook() {
      try {
        const loadingTask = pdfjsLib.getDocument(pdfUrl);
        const pdf = await loadingTask.promise;
        const totalPages = pdf.numPages;
        const bookElem = document.getElementById('flipbook');

        // Ambil dimensi asli lembar PDF
        const firstPage = await pdf.getPage(1);
        const unscaledViewport = firstPage.getViewport({ scale: 1.0 });
        const pdfAspect = unscaledViewport.width / unscaledViewport.height;

        // Hitung batas ruang layar peramban
        const screenW = window.innerWidth;
        const screenH = window.innerHeight;
        const isMobile = screenW <= 768;

        // Render canvas berkualitas tinggi (2.0x) agar teks tetap tajam saat dizoom
        const renderScale = window.devicePixelRatio > 1 ? 2.0 : 1.5;

        for (let num = 1; num <= totalPages; num++) {
          const page = await pdf.getPage(num);
          const viewport = page.getViewport({ scale: renderScale });

          const pageDiv = document.createElement('div');
          pageDiv.className = 'page';

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          await page.render({
            canvasContext: context,
            viewport: viewport
          }).promise;

          pageDiv.appendChild(canvas);
          bookElem.appendChild(pageDiv);
        }

        document.getElementById('loading').style.display = 'none';
        bookElem.style.display = 'block';

        // Hitung proporsi ukuran buku agar pas memenuhi layar HP
        let targetH = screenH * 0.96;
        let targetW = targetH * pdfAspect;

        if (targetW > screenW * 0.96) {
          targetW = screenW * 0.96;
          targetH = targetW / pdfAspect;
        }

        // Inisialisasi St.PageFlip
        pageFlip = new St.PageFlip(bookElem, {
          width: Math.round(targetW),
          height: Math.round(targetH),
          size: 'fixed',
          showCover: !isMobile,
          usePortrait: isMobile, // Kunci 1 halaman di layar HP agar ukuran maksimal
          startPage: 0,
          drawShadow: true,
          useMouseEvents: true,
          swipeDistance: 30, // Jarak usapan sentuh di HP
          mobileScrollSupport: true
        });

        pageFlip.loadFromHTML(document.querySelectorAll('.page'));

        const badge = document.getElementById('page-badge');
        const updateBadge = (idx) => {
          badge.innerText = `${idx + 1} / ${pageFlip.getPageCount()}`;
        };
        updateBadge(0);

        pageFlip.on('flip', (e) => {
          updateBadge(e.data);
        });

        // Event Navigasi Ketuk Sisi Layar
        document.getElementById('tap-prev').addEventListener('click', () => {
          pageFlip.flipPrev();
        });

        document.getElementById('tap-next').addEventListener('click', () => {
          pageFlip.flipNext();
        });

        // Event Keyboard (Desktop)
        window.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowLeft') pageFlip.flipPrev();
          if (e.key === 'ArrowRight') pageFlip.flipNext();
        });

      } catch (err) {
        document.getElementById('loading').innerText = 'Gagal memuat PDF. Pastikan file buku.pdf tersedia.';
        console.error(err);
      }
    }

    document.addEventListener('DOMContentLoaded', initPdfFlipbook);
  </script>
</body>
</html>
