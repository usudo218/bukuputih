<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buku Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="book-container">
        <!-- Tombol Navigasi Halaman Buku -->
        <button id="prev-btn" class="nav-btn" style="display: none;">‹</button>
        <button id="next-btn" class="nav-btn" style="display: none;">›</button>

        <!-- Kontainer Halaman Buku & Daftar Isi -->
        <div id="pages-wrapper"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const wrapper = document.getElementById('pages-wrapper');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            
            let pages = [];
            let currentIndex = 0;
            let daftarJudulBab = {};

            // 1. Tampilkan Daftar Isi Buku Klasik
            function tampilkanDaftarIsi() {
                wrapper.innerHTML = '';
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';

                let menuPage = document.createElement('div');
                menuPage.className = 'page page-cover';
                
                let htmlMenu = `<h2>Daftar Isi</h2><div class="toc-list">`;
                
                for (let i = 1; i <= 9; i++) {
                    let judulTampil = daftarJudulBab[i] || `Memuat Bab ${i}...`;
                    htmlMenu += `
                        <div class="toc-item">
                            <span class="toc-title" data-bab="${i}"><b>Bab ${i}</b> — ${judulTampil}</span>
                        </div>
                    `;
                }
                htmlMenu += `</div><div class="page-number">1</div>`;
                
                menuPage.innerHTML = htmlMenu;
                wrapper.appendChild(menuPage);

                // Ambil judul dari file artikel secara asinkron
                for (let i = 1; i <= 9; i++) {
                    if (!daftarJudulBab[i]) {
                        loadJudulArtikel(i);
                    }
                }

                // Event klik pada daftar isi
                document.querySelectorAll('.toc-title').forEach(el => {
                    el.addEventListener('click', (e) => {
                        let nomorBab = e.target.getAttribute('data-bab') || e.target.closest('.toc-title').getAttribute('data-bab');
                        muatBab(nomorBab);
                    });
                });
            }

            // Fungsi Ambil Metadata Judul Bab
            function loadJudulArtikel(nomorBab) {
                const scriptId = `temp-script-${nomorBab}`;
                if (document.getElementById(scriptId)) return;

                const script = document.createElement('script');
                script.id = scriptId;
                script.src = `artikel/artikel${nomorBab}.js?v=` + new Date().getTime();
                
                script.onload = () => {
                    if (window.kontenArtikel) {
                        daftarJudulBab[nomorBab] = window.kontenArtikel.judul;
                        const spanEl = document.querySelector(`.toc-title[data-bab="${nomorBab}"]`);
                        if (spanEl) {
                            spanEl.innerHTML = `<b>Bab ${nomorBab}</b> — ${window.kontenArtikel.judul}`;
                        }
                        window.kontenArtikel = null; 
                    }
                };
                script.onerror = () => {
                    const spanEl = document.querySelector(`.toc-title[data-bab="${nomorBab}"]`);
                    if (spanEl) spanEl.innerHTML = `<b>Bab ${nomorBab}</b> — *(File artikel${nomorBab}.js belum ada)*`;
                };
                document.body.appendChild(script);
            }

            // 2. Fungsi Memuat Isi Bab Penuh Saat Diklik
            function muatBab(nomorBab) {
                const oldScript = document.getElementById('active-article-script');
                if (oldScript) oldScript.remove();

                window.kontenArtikel = null;

                const script = document.createElement('script');
                script.id = 'active-article-script';
                script.src = `artikel/artikel${nomorBab}.js?v=` + new Date().getTime();
                
                script.onload = () => {
                    setTimeout(() => {
                        if (window.kontenArtikel) {
                            generateBuku(nomorBab, window.kontenArtikel);
                        } else {
                            alert(`File artikel/artikel${nomorBab}.js tidak valid (window.kontenArtikel tidak ditemukan).`);
                        }
                    }, 50);
                };

                script.onerror = () => {
                    // Fallback otomatis jika file .js belum dibuat
                    let dummyData = {
                        bab: `Bab ${nomorBab}`,
                        judul: `Judul Artikel Bab ${nomorBab} (Contoh Sementara)`,
                        paragraf: [
                            `Ini adalah paragraf contoh untuk menguji tata letak halaman Bab ${nomorBab} karena file fisik artikel${nomorBab}.js belum ditemukan di dalam folder artikel/.`,
                            "Pastikan Anda membuat file artikel dengan nama yang sesuai agar teks aslinya dapat dimuat dengan sempurna di sini."
                        ]
                    };
                    generateBuku(nomorBab, dummyData);
                };
                document.body.appendChild(script);
            }

            // 3. Generator Halaman Buku (Auto-Pagination dengan Margin Presisi & Perbaikan Gambar)
            function generateBuku(nomorBab, data) {
                wrapper.innerHTML = '';
                
                // Halaman 1: Cover Bab & Gambar Ilustrasi
                const pageCover = document.createElement('div');
                pageCover.className = 'page page-cover';
                
                // Penanganan jalur gambar: Mencoba memuat images/gambarX.jpg, jika gagal fallback ke gambar1.jpg
                pageCover.innerHTML = `
                    <h3>${data.bab || 'Bab ' + nomorBab}</h3>
                    <h1 style="font-size: 1.1rem; margin: 10px 0; color: #2c3e50;">${data.judul}</h1>
                    <img src="images/gambar${nomorBab}.jpg" alt="Ilustrasi Bab ${nomorBab}" 
                         onerror="this.onerror=null; this.src='images/gambar1.jpg';">
                    <div style="margin-top: 15px;"><button class="back-menu-btn">← Daftar Isi</button></div>
                    <div class="page-number">1</div>
                `;
                wrapper.appendChild(pageCover);

                // Halaman Isi Artikel Pertama
                let currentPage = document.createElement('div');
                currentPage.className = 'page';
                let pageNum = 2;
                
                let contentHTML = `<h2>${data.bab || 'Bab ' + nomorBab}: ${data.judul}</h2>`;
                currentPage.innerHTML = contentHTML + `<div class="page-number">${pageNum}</div>`;
                wrapper.appendChild(currentPage);

                // Algoritma pemecah paragraf otomatis dengan batas tinggi aman
                data.paragraf.forEach((teks) => {
                    let p = document.createElement('p');
                    p.textContent = teks;
                    currentPage.insertBefore(p, currentPage.lastElementChild);

                    // Batas tinggi aman dikurangi 50px agar tidak menabrak nomor halaman/bawah
                    const batasTinggiAman = currentPage.clientHeight - 50;

                    if (currentPage.scrollHeight > batasTinggiAman) {
                        currentPage.removeChild(p);
                        pageNum++;
                        
                        currentPage = document.createElement('div');
                        currentPage.className = 'page';
                        currentPage.style.display = 'none';
                        
                        currentPage.innerHTML = `<div class="page-number">${pageNum}</div>`;
                        currentPage.insertBefore(p, currentPage.firstChild);
                        wrapper.appendChild(currentPage);
                    }
                });

                // Tombol kembali di halaman akhir bab
                let lastPage = wrapper.lastElementChild;
                let backMenuDiv = document.createElement('div');
                backMenuDiv.style.marginTop = "15px";
                backMenuDiv.innerHTML = `<button class="back-menu-btn" style="width:100%;">Kembali ke Daftar Isi</button>`;
                lastPage.insertBefore(backMenuDiv, lastPage.lastElementChild);

                // Event listener untuk tombol kembali ke daftar isi
                document.querySelectorAll('.back-menu-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        currentIndex = 0;
                        tampilkanDaftarIsi();
                    });
                });

                pages = document.querySelectorAll('.page');
                currentIndex = 0;
                updateNavigasi();
            }

            function updateNavigasi() {
                pages.forEach((page, i) => {
                    page.style.display = (i === currentIndex) ? 'flex' : 'none';
                });
                prevBtn.style.display = (currentIndex > 0) ? 'block' : 'none';
                nextBtn.style.display = (currentIndex < pages.length - 1) ? 'block' : 'none';
            }

            nextBtn.addEventListener('click', () => {
                if (currentIndex < pages.length - 1) { currentIndex++; updateNavigasi(); }
            });

            prevBtn.addEventListener('click', () => {
                if (currentIndex > 0) { currentIndex--; updateNavigasi(); }
            });

            // Inisialisasi awal saat pertama kali dibuka
            tampilkanDaftarIsi();
        });
    </script>
</body>
</html>
