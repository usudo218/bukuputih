<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buku Digital - Bab 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="book-container">
        <!-- Tombol Navigasi Halaman -->
        <button id="prev-btn" class="nav-btn">‹</button>
        <button id="next-btn" class="nav-btn">›</button>

        <!-- Halaman akan digenerate secara dinamis di sini -->
        <div id="pages-wrapper"></div>
    </div>

    <!-- Memanggil data artikel terpisah -->
    <script src="artikel.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const wrapper = document.getElementById('pages-wrapper');
            
            // 1. Buat Halaman 1: Gambar Ilustrasi (Cover Bab)
            const pageCover = document.createElement('div');
            pageCover.className = 'page page-cover';
            pageCover.innerHTML = `
                <img src="images/gambar1.jpg" alt="Ilustrasi Bab 1">
                <div class="page-number">1</div>
            `;
            wrapper.appendChild(pageCover);

            // 2. Buat Halaman Artikel secara Dinamis Berdasarkan Panjang Teks
            let currentPage = document.createElement('div');
            currentPage.className = 'page';
            let pageNum = 2;
            
            // Tambahkan Judul di awal halaman artikel pertama
            let contentHTML = `<h2>${kontenArtikel.judul}</h2>`;
            
            // Simulasi penampung sementara untuk menguji tinggi elemen
            currentPage.innerHTML = contentHTML + `<div class="page-number">${pageNum}</div>`;
            wrapper.appendChild(currentPage);

            // Fungsi untuk memecah paragraf agar pas di dalam batas halaman HP
            kontenArtikel.paragraf.forEach((teks) => {
                let p = document.createElement('p');
                p.textContent = teks;
                
                // Masukkan paragraf ke halaman aktif untuk diuji tingginya
                currentPage.insertBefore(p, currentPage.lastElementChild);

                // Cek apakah konten meluber (overflow) melewati batas tinggi halaman CSS
                // (100vh dikurangi padding atas-bawah)
                if (currentPage.scrollHeight > currentPage.clientHeight) {
                    // Jika muatannya kepanjangan, tarik keluar paragraf tersebut
                    currentPage.removeChild(p);
                    
                    // Buat halaman baru
                    pageNum++;
                    currentPage = document.createElement('div');
                    currentPage.className = 'page';
                    currentPage.style.display = 'none'; // Sembunyikan halaman lain awalnya
                    
                    // Masukkan paragraf ke halaman baru
                    currentPage.innerHTML = `<div class="page-number">${pageNum}</div>`;
                    currentPage.insertBefore(p, currentPage.firstChild);
                    wrapper.appendChild(currentPage);
                }
            });

            // 3. Logika Navigasi Buku (Bolak-balik halaman)
            const pages = document.querySelectorAll('.page');
            let currentIndex = 0;

            function showPage(index) {
                pages.forEach((page, i) => {
                    page.style.display = (i === index) ? 'flex' : 'none';
                });
            }

            // Inisialisasi tampilkan halaman pertama
            showPage(currentIndex);

            document.getElementById('next-btn').addEventListener('click', () => {
                if (currentIndex < pages.length - 1) {
                    currentIndex++;
                    showPage(currentIndex);
                }
            });

            document.getElementById('prev-btn').addEventListener('click', () => {
                if (currentIndex > 0) {
                    currentIndex--;
                    showPage(currentIndex);
                }
            });

            // Dukungan geser layar sentuh (Swipe touch untuk HP)
            let touchStartX = 0;
            let touchEndX = 0;

            document.getElementById('book-container').addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
            });

            document.getElementById('book-container').addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            });

            function handleSwipe() {
                if (touchEndX < touchStartX - 50) {
                    // Geser Kiri -> Halaman Berikutnya
                    if (currentIndex < pages.length - 1) { currentIndex++; showPage(currentIndex); }
                }
                if (touchEndX > touchStartX + 50) {
                    // Geser Kanan -> Halaman Sebelumnya
                    if (currentIndex > 0) { currentIndex--; showPage(currentIndex); }
                }
            }
        });
    </script>
</body>
</html>
