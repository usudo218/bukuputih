<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
  <title>Buku Putih - Responsive & Zoom Flipbook</title>

  <!-- Pustaka PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Pustaka Page-Flip -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <!-- Pustaka Panzoom untuk fitur Pinch & Double Tap Zoom -->
  <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom/dist/panzoom.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #loading-layer {
      position: fixed;
      inset: 0;
      background-color: #0b0f19;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 14px;
      z-index: 999;
      gap: 12px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Area Pandang Utama */
    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Elemen yang di-zoom oleh Panzoom */
    #zoom-layer {
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .flipbook-container {
      display: none;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
    }

    .page {
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .page canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
    }

    /* Area Ketuk Sisi Layar untuk Pindah Halaman */
    .touch-edge {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 20%;
      z-index: 50;
      cursor: pointer;
    }

    .touch-edge.left {
      left: 0;
    }

    .touch-edge.right {
      right: 0;
    }

    /* Indikator Halaman dan Panduan Singkat */
    .hud {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.75);
      color: #f1f5f9;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 20px;
      z-index: 100;
      pointer-events: none;
      backdrop-filter: blur(8px);
      letter-spacing: 0.5px;
    }

    /* Tombol Reset Zoom jika sedang membesar */
    #btn-reset-zoom {
      position: fixed;
      top: 14px;
      right: 14px;
      background: rgba(15, 23, 42, 0.85);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 16px;
      z-index: 100;
      display: none;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>

  <div id="loading-layer">
    <div class="spinner"></div>
    <div id="loading-text">Menyiapkan halaman buku...</div>
  </div>

  <button id="btn-reset-zoom">Reset Zoom (1x)</button>

  <div class="viewport">
    <!-- Area Sentuh Kiri -->
    <div class="touch-edge left" id="touch-left"></div>

    <!-- Lapisan Pembesar / Zoomable -->
    <div id="zoom-layer">
      <div id="flipbook" class="flipbook-container"></div>
    </div>

    <!-- Area Sentuh Kanan -->
    <div class="touch-edge right" id="touch-right"></div>

    <!-- Info Lembar -->
    <div class="hud" id="page-hud">1 / -</div>
  </div>

  <script>
    const pdfUrl = 'buku.pdf';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pageFlip = null;
    let panzoomInstance = null;
    let pdfAspect = 0.7;

    async function setupFlipbook() {
      try {
        const loadingTask = pdfjsLib.getDocument(pdfUrl);
        const pdf = await loadingTask.promise;
        const totalPages = pdf.numPages;
        const bookElem = document.getElementById('flipbook');

        // Mengambil dimensi asli halaman
        const firstPage = await pdf.getPage(1);
        const unscaledViewport = firstPage.getViewport({ scale: 1.0 });
        pdfAspect = unscaledViewport.width / unscaledViewport.height;

        // Render Canvas dengan skala 2x agar teks tetap tajam saat di-zoom
        const renderScale = Math.max(window.devicePixelRatio || 1, 2.0);

        for (let num = 1; num <= totalPages; num++) {
          const page = await pdf.getPage(num);
          const viewport = page.getViewport({ scale: renderScale });

          const pageDiv = document.createElement('div');
          pageDiv.className = 'page';

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          await page.render({
            canvasContext: context,
            viewport: viewport
          }).promise;

          pageDiv.appendChild(canvas);
          bookElem.appendChild(pageDiv);
        }

        document.getElementById('loading-layer').style.display = 'none';
        bookElem.style.display = 'block';

        buildPageFlip();
        setupPanzoom();

      } catch (err) {
        document.getElementById('loading-text').innerText = 'Gagal memuat berkas PDF. Pastikan nama file adalah buku.pdf';
        console.error(err);
      }
    }

    function calculateDimensions() {
      const sw = window.innerWidth;
      const sh = window.innerHeight;
      const isMobile = sw <= 768 || sw < sh;

      let targetH = sh * 0.94;
      let targetW = targetH * pdfAspect;

      // Pastikan pas di lebar layar ponsel
      if (targetW > sw * 0.94) {
        targetW = sw * 0.94;
        targetH = targetW / pdfAspect;
      }

      return {
        w: Math.round(targetW),
        h: Math.round(targetH),
        isMobile: isMobile
      };
    }

    function buildPageFlip() {
      const { w, h, isMobile } = calculateDimensions();
      const bookElem = document.getElementById('flipbook');

      pageFlip = new St.PageFlip(bookElem, {
        width: w,
        height: h,
        size: 'fixed',
        showCover: !isMobile,
        usePortrait: isMobile, // 1 Halaman di HP, 2 Halaman jika layar lebar
        startPage: 0,
        drawShadow: true,
        useMouseEvents: true,
        swipeDistance: 25,
        mobileScrollSupport: true
      });

      pageFlip.loadFromHTML(document.querySelectorAll('.page'));

      const hud = document.getElementById('page-hud');
      const updateHud = (idx) => {
        hud.innerText = `${idx + 1} / ${pageFlip.getPageCount()}`;
      };
      updateHud(0);

      pageFlip.on('flip', (e) => updateHud(e.data));
    }

    function setupPanzoom() {
      const zoomElem = document.getElementById('zoom-layer');
      const resetBtn = document.getElementById('btn-reset-zoom');

      panzoomInstance = Panzoom(zoomElem, {
        maxScale: 4,
        minScale: 1,
        contain: 'outside',
        disablePan: true // Matikan pan saat skala 1x agar usapan tidak bentrok dengan pembalik halaman
      });

      zoomElem.parentElement.addEventListener('wheel', panzoomInstance.zoomWithWheel);

      // Tangani event zoom berubah
      zoomElem.addEventListener('panzoomchange', (e) => {
        const currentScale = e.detail.scale;
        if (currentScale > 1.05) {
          panzoomInstance.setOptions({ disablePan: false });
          resetBtn.style.display = 'block';
        } else {
          panzoomInstance.setOptions({ disablePan: true });
          resetBtn.style.display = 'none';
        }
      });

      // Fitur Double Tap di Smartphone untuk Zoom Cepat
      let lastTouchTime = 0;
      zoomElem.addEventListener('touchend', (e) => {
        const currentTime = new Date().getTime();
        const tapInterval = currentTime - lastTouchTime;
        if (tapInterval < 300 && tapInterval > 0) {
          e.preventDefault();
          if (panzoomInstance.getScale() > 1.2) {
            panzoomInstance.reset();
          } else {
            panzoomInstance.zoomToPoint(2.2, {
              clientX: e.changedTouches[0].clientX,
              clientY: e.changedTouches[0].clientY
            });
          }
        }
        lastTouchTime = currentTime;
      });

      resetBtn.addEventListener('click', () => {
        panzoomInstance.reset();
      });

      // Navigasi Ketuk Sisi Kiri / Kanan Layar (Hanya berfungsi saat skala 1x)
      document.getElementById('touch-left').addEventListener('click', () => {
        if (panzoomInstance.getScale() <= 1.05) {
          pageFlip.flipPrev();
        }
      });

      document.getElementById('touch-right').addEventListener('click', () => {
        if (panzoomInstance.getScale() <= 1.05) {
          pageFlip.flipNext();
        }
      });
    }

    // Tangani perubahan ukuran layar (misal rotasi HP)
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (pageFlip) {
          const { w, h, isMobile } = calculateDimensions();
          pageFlip.update({
            width: w,
            height: h,
            usePortrait: isMobile,
            showCover: !isMobile
          });
        }
        if (panzoomInstance) {
          panzoomInstance.reset();
        }
      }, 300);
    });

    document.addEventListener('DOMContentLoaded', setupFlipbook);
  </script>
</body>
</html>
