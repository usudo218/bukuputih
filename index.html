<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Flipbook Interaktif</title>

  <!-- Pustaka PDF.js (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Pustaka Page-Flip (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1e293b;
      font-family: sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 10px;
    }

    #loading {
      color: #f1f5f9;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .flipbook-container {
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      border-radius: 4px;
      background-color: #334155;
      display: none; /* Muncul setelah PDF selesai dirender */
    }

    /* Tiap kanvas halaman */
    .page {
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .page canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Kontrol navigasi */
    .controls {
      margin-top: 18px;
      display: none;
      align-items: center;
      gap: 16px;
    }

    button {
      background-color: #3b82f6;
      color: #ffffff;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }

    button:hover {
      background-color: #2563eb;
    }

    .page-indicator {
      color: #f1f5f9;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div id="loading">Memuat dokumen PDF... Harap tunggu sebentar.</div>

  <!-- Wadah Flipbook -->
  <div id="flipbook" class="flipbook-container"></div>

  <!-- Tombol Navigasi -->
  <div class="controls" id="controls">
    <button id="btn-prev">&larr; Halaman Sebelumnya</button>
    <div class="page-indicator" id="page-num">Halaman 1</div>
    <button id="btn-next">Halaman Berikutnya &rarr;</button>
  </div>

  <script>
    // Tentukan path berkas PDF Anda
    const pdfUrl = 'buku.pdf'; 

    // Konfigurasi worker PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    async function initPdfFlipbook() {
      try {
        const loadingTask = pdfjsLib.getDocument(pdfUrl);
        const pdf = await loadingTask.promise;
        const totalPages = pdf.numPages;
        const bookElem = document.getElementById('flipbook');

        // Ambil dimensi asli halaman pertama untuk menentukan rasio flipbook
        const firstPage = await pdf.getPage(1);
        const viewport = firstPage.getViewport({ scale: 1.5 });
        const pageWidth = Math.round(viewport.width);
        const pageHeight = Math.round(viewport.height);

        // Render seluruh halaman PDF menjadi elemen canvas
        for (let num = 1; num <= totalPages; num++) {
          const page = await pdf.getPage(num);
          const pageViewport = page.getViewport({ scale: 1.5 });

          const pageDiv = document.createElement('div');
          pageDiv.className = 'page';

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = pageViewport.height;
          canvas.width = pageViewport.width;

          await page.render({
            canvasContext: context,
            viewport: pageViewport
          }).promise;

          pageDiv.appendChild(canvas);
          bookElem.appendChild(pageDiv);
        }

        // Sembunyikan pesan loading dan tampilkan buku
        document.getElementById('loading').style.display = 'none';
        bookElem.style.display = 'block';
        document.getElementById('controls').style.display = 'flex';

        // Inisialisasi Page-Flip
        const pageFlip = new St.PageFlip(bookElem, {
          width: pageWidth / 1.5,
          height: pageHeight / 1.5,
          size: 'stretch',
          minWidth: 320,
          maxWidth: 600,
          minHeight: 450,
          maxHeight: 850,
          showCover: true,
          useMouseEvents: true
        });

        pageFlip.loadFromHTML(document.querySelectorAll('.page'));

        const pageNumDisplay = document.getElementById('page-num');
        pageFlip.on('flip', (e) => {
          pageNumDisplay.innerText = `Halaman ${e.data + 1} dari ${pageFlip.getPageCount()}`;
        });

        // Kontrol tombol
        document.getElementById('btn-prev').addEventListener('click', () => pageFlip.flipPrev());
        document.getElementById('btn-next').addEventListener('click', () => pageFlip.flipNext());

        // Kontrol keyboard
        window.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowLeft') pageFlip.flipPrev();
          if (e.key === 'ArrowRight') pageFlip.flipNext();
        });

      } catch (err) {
        document.getElementById('loading').innerText = 'Gagal memuat PDF. Pastikan nama file sesuai dan dijalankan melalui local server.';
        console.error(err);
      }
    }

    document.addEventListener('DOMContentLoaded', initPdfFlipbook);
  </script>
</body>
</html>
